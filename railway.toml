# Railway configuration as code.
# This service is built from the repository root with the existing Dockerfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/Dockerfile", "/package.json", "/package-lock.json", "/server/**", "/client/**"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
